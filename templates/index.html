<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Fitness Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="\static\sprite_animation.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <style>

      body {
        font-family: "Inter", sans-serif;
        background-color: #111827;
        color: #f3f4f6;
        min-height: max(884px, 100dvh);
      }
      .main-container {
        max-width: 420px;
        margin: 0 auto;
        background-color: #050505;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 24px 20px;
      }
      .header-title {
        font-size: 28px;
        font-weight: 700;
      }
      .header-score {
        font-size: 20px;
        font-weight: 500;
        color: #fbbf24;
      }
      .header-score .material-icons {
        font-size: 20px;
        vertical-align: middle;
      }

      .form-section,
      .records-section {
        padding: 24px 20px;
      }
      .section-title {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #d1d5db;
      }
      .form-input,
      .form-select {
        background-color: #374151;
        border: 1px solid #4b5563;
        color: #f3f4f6;
        border-radius: 8px;
        padding: 12px;
        width: 100%;
        font-size: 16px;
        margin-bottom: 16px;
        appearance: none;
      }
      .form-input::placeholder {
        color: #9ca3af;
      }
      .form-select-container {
        position: relative;
      }
      .form-select-container .material-icons {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        pointer-events: none;
      }
      .submit-button {
        background-color: #3b82f6;
        color: white;
        font-weight: 600;
        padding: 14px;
        border-radius: 8px;
        text-align: center;
        width: 100%;
        font-size: 18px;
        transition: background-color 0.3s ease;
      }
      .submit-button:hover {
        background-color: #2563eb;
      }
      .table-container {
        overflow-x: auto;
      }
      .records-table {
        width: 100%;
        border-collapse: collapse;
      }
      .records-table th,
      .records-table td {
        padding: 12px 10px;
        text-align: left;
        font-size: 14px;
        border-bottom: 1px solid #374151;
      }
      .records-table th {
        background-color: #4a5568;
        color: #e5e7eb;
        font-weight: 600;
      }
      .records-table td {
        color: #d1d5db;
      }
      .records-table tr:last-child td {
        border-bottom: none;
      }
      .nav-bar {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 16px 0;
        background-color: #070707;
        border-top: 1px solid #374151;
        position: sticky;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
      }
      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #9ca3af;
        cursor: pointer;
        transition: color 0.3s ease;
      }
      .nav-item .material-icons {
        font-size: 28px;
        margin-bottom: 4px;
      }
      .nav-item span {
        font-size: 12px;
      }
      .nav-item.active,
      .nav-item:hover {
        color: #3b82f6;
      }
      .nav-item a span {
        display: block; /* Makes each span take its own line */
      }
      .flex-grow {
        flex-grow: 1;
      }

      @keyframes popupFadeIn {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .checkin_popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .checkin_popup-card {
      background: rgb(0, 0, 0);
      color: whitesmoke;
      padding: 20px;
      border: 3px solid;
      border-radius: 10px;
      border-color:  rgb(105, 171, 222);
      position: relative;
      width: 80vw;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: popupFadeIn 0.4s ease-out;
    }

    .checkin_popup_close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    .checkin_btn, .checkin_remind_btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .checkin_remind_btn {
      background-color:  rgb(105, 171, 222);
      margin-left: 10px;
    }

    </style>

  </head>
  <body>
    <div class="main-container">
      <header class="header">
        <h1 class="header-title">
          Hey, <span class="text-blue-400" id="username"></span>
        </h1>
        <h4>
          <p class="header-score" style="display: flex; align-items: center; gap: 4px;">
            Score : <span id="user_score"></span> <span class="material-icons">bolt</span>
          </p>
        </h4>
      </header>

      <main class="flex-grow">
        <section class="form-section">
          <h2 class="section-title">Log Your Exercise</h2>
          <form id="prForm">
            <div class="grid grid-cols-2 gap-4 mb-4">
              <div class="form-select-container">
                <select class="form-select" id="category" required>
                  <option value="" disabled selected>Targets</option>
                    <option value="Arms">Arms</option>
                    <option value="Back">Back</option>
                    <option value="Chest">Chest</option>
                    <option value="Shoulders">Shoulders</option>
                    <option value="Core">Core</option>
                    <option value="Legs">Legs</option>
                </select>
              </div>

            <input class="form-input" id="exercise" placeholder="Exercise Name" type="text"/>
            </div>
            <input class="form-input" id="weights" placeholder="Weight (kg)" type="float" />
            <input class="form-input" id="sets" placeholder="Sets" type="number" />
            <input class="form-input" id="reps" placeholder="Reps" type="number" />
            <button class="submit-button" type="submit">Submit</button>

            <p id="LogMessage"></p>

          </form>
        </section>
        

        <div class="checkin_popup-overlay" id="checkin_popup">
            <div class="checkin_popup-card">
              <div class="checkin_popup_close" id="checkin_popup_close">✖</div><br>
              <p style="font-size: 1.5rem; font-weight: bold; color:#fbbf24; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">
                Finished your Workout
              </p><br>
              
              <img src="{{ url_for('static', filename='media/training.png') }}" alt="Training" style="display: block; margin: 0 auto; max-width: 70%; height: auto;">
              <!-- <div class="ryu"></div>               -->
              <button class="checkin_btn" id="checkin_btn">Check IN</button>
              <button class="checkin_remind_btn" id="checkin_remind_btn">Remind me later</button>
            </div>
        </div>

        <section class="records-section p-4">
          <h2 class="text-2xl font-bold mb-4 text-white">Personal Records</h2>
          <div id="exerciseContainer" class="grid gap-6">
            <!-- JS will insert categories here -->
          </div>
        </section>
        
        </section>

      </main>
      <nav class="nav-bar">
        <div class="nav-item active">
          <a href="/">
          <span class="material-icons">home</span>
          <span>Home</span> </a>
        </div>
        <div class="nav-item">
          <a href="/dashboard">
          <span class="material-icons">leaderboard</span>
          <span>Stats</span> </a>
        </div>
        <div class="nav-item">
          <a href="/profile">
          <span class="material-icons">person</span>
          <span>Profile</span> </a>
        </div>
        <div class="nav-item">
          <a href="/signout">
          <span class="material-icons">logout</span>
          <span>Logout</span> </a>
        </div>
      </nav>
    </div>


    <script>
      const authToken = localStorage.getItem("authToken"); // Fetch token from localStorage
      const username = localStorage.getItem("username")

      document.getElementById("prForm").addEventListener("submit", async function(event) {
          event.preventDefault(); // Prevent default form submission

          // Get values from form
          const category = document.getElementById("category").value;
          const exercise = document.getElementById("exercise").value;
          const weights = document.getElementById("weights").value;
          const sets = document.getElementById("sets").value;
          const reps = document.getElementById("reps").value;

          // Create request body
          const requestData = {
              category: category,
              exercise_name: exercise,
              weights: parseFloat(weights),
              sets: parseInt(sets),
              reps: parseInt(reps)
          };

          try {
              const response = await fetch("/insert_PR", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                      "Authorization": `Bearer ${authToken}` // Attach token for authentication
                  },
                  body: JSON.stringify(requestData)
              });

              const result = await response.json();
              //console.log(result)

              if (result.success) {
                  document.getElementById("prForm").reset();
                  loadExerciseData()
                  
                  const userscoreSpan = document.getElementById("user_score");
                  userscoreSpan.textContent = `${result.Score}`;

                  const logMessage = document.getElementById("LogMessage");
                  logMessage.innerText = result.message;
                  logMessage.style.color = "lightgreen"; // Optional: style it green on success

                  setTimeout(() => {
                                  logMessage.innerText = ""
                              }, 2000);
          
                  // alert(result.message);
              } else {
                  alert("Error: " + result.message);
              }
          } catch (error) {
              console.error("Error submitting PR:", error);
              alert("Failed to submit PR.");
          }
      });

      async function loadExerciseData() {
        try {
            const response = await fetch("/get_exercises", {
                headers: { "Authorization": `Bearer ${authToken}` }
            });
            const data = await response.json();

            const container = document.getElementById("exerciseContainer");
            container.innerHTML = "";

            // ✅ Group by category
            const grouped = {};
            data.exercises.forEach(ex => {
                const cat = ex.category || "Uncategorized";
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(ex);
            });

            // ✅ Render category cards
            for (const [category, exercises] of Object.entries(grouped)) {
                const card = document.createElement("div");
                card.className = "bg-gray-900 rounded-2xl p-4 shadow-lg";

                const title = `<h3 class="text-xl font-semibold mb-3 text-yellow-400">${category}</h3>`;
                const table = `
                  <div class="overflow-x-auto">
                    <table class="w-full text-sm text-gray-300">
                      <thead class="border-b border-gray-700">
                        <tr>
                          <th class="text-left py-2">Exercise</th>
                          <th class="text-center py-2">Weight</th>
                          <th class="text-center py-2">Sets</th>
                          <th class="text-center py-2">Reps</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${exercises.map(ex => `
                          <tr class="hover:bg-gray-800 transition">
                            <td class="py-2">${ex.exercise_name}</td>
                            <td class="text-center py-2">${ex.weights.$numberInt || ex.weights} kg</td>
                            <td class="text-center py-2">${ex.sets.$numberInt || ex.sets}</td>
                            <td class="text-center py-2">${ex.reps.$numberInt || ex.reps}</td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>`;

                card.innerHTML = title + table;
                container.appendChild(card);
            }

        } catch (error) {
            console.error(error);
        }
    }


      async function CheckTokenExpiration() {
        
          if (!authToken) {
              //alert("Token not found");
              window.location.href = "/login"; // Redirect to login page
              return;
          }

          try {
              const response = await fetch("/decode_Token", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                      "Authorization": `Bearer ${authToken}` // Attach token for authentication
                  }
              });

              const result = await response.json(); // Parse JSON response

              if (!result.success) {
                  localStorage.clear();
                  window.location.href = "/login"; // Redirect to login page

              }

          } catch (error) {
              console.error("Error validating token:", error);
              alert("Failed to validate token. Redirecting to login.");
              localStorage.removeItem("authToken");
              window.location.href = "/login";
          }
      }

      async function fetch_user_score() {

          if(username)
          {
              const url = username ? `/Fetch_Score?username=${encodeURIComponent(username)}` : "/Fetch_Score";

              try {
                  const response = await fetch(url, {
                      method: "GET",
                      headers: {
                          "Content-Type": "application/json",
                          "Authorization": `Bearer ${authToken}` // Attach token for authentication
                      }
                  });

                  const result = await response.json(); // Parse JSON response
                  //console.log("fetched score", result)

                  if (!result.success) {
                      console.log("unable to fetch user score")

                  } else {
                      const userscoreSpan = document.getElementById("user_score");
                      userscoreSpan.textContent = `${result.Score}`;
                      
                  }} 

              catch (error) {
                  console.error("unable to make api fetchscore", error);
              }
          }
          
      }

      function DailyCheckinPopup() {
        const popup = document.getElementById('checkin_popup');
        const closeBtn = document.getElementById('checkin_popup_close');
        const checkinBtn = document.getElementById('checkin_btn');
        const remindBtn = document.getElementById('checkin_remind_btn');
        const now = Date.now();

        const shouldShowPopup = () => {
          const today = new Date(now).toLocaleDateString('en-CA', {
            timeZone: 'Asia/Kolkata',
          });

          const lastCheckin = localStorage.getItem('checkin_completed');
          const remindTime = parseInt(localStorage.getItem('checkin_remindTime'), 10);

          if (lastCheckin === today) return false;

          if (!isNaN(remindTime)) {
            if (now < remindTime) return false;
            localStorage.removeItem('checkin_remindTime');
          }

          return true;
        };

        const handleRemindLater = () => {
          popup.style.display = 'none';
          const remindAfter = now + 30 * 60 * 1000; // 30 minutes
          localStorage.setItem('checkin_remindTime', remindAfter.toString());
        };

        const handleCheckin = () => {
          popup.style.display = 'none';

          const today = new Date(now).toLocaleDateString('en-CA', {
            timeZone: 'Asia/Kolkata',
          });

          localStorage.setItem('checkin_completed', today);
          localStorage.removeItem('checkin_remindTime');

          const username = localStorage.getItem('username');

          fetch("/workout_checkin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, date: today })
          })
            .then(response => response.json())
            .then(data => console.log("Check-in response:", data))
            .catch(error => console.error("Error checking in:", error));
        };

        if (shouldShowPopup()) {
          popup.style.display = 'flex';
        }

        closeBtn.addEventListener('click', handleRemindLater);
        remindBtn.addEventListener('click', handleRemindLater);
        checkinBtn.addEventListener('click', handleCheckin);

      }

      // Ensure function runs when page loads
  // Run all DOMContentLoaded handlers
  document.addEventListener("DOMContentLoaded", () => {
        CheckTokenExpiration();
        loadExerciseData();
        fetch_user_score();
        DailyCheckinPopup();
      });

  </script>
</body>
